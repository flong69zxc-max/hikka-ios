name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      # 1. Клонируем основной репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Клонируем Hikka (правильный путь)
      - name: Clone Hikka repository
        run: |
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages
          
          # Клонируем через HTTPS (публичный репозиторий)
          echo "🔄 Cloning hikariatama/hikka..."
          git clone https://github.com/hikariatama/hikka.git || \
          echo "⚠️ Git clone failed, trying alternative method..."
          
          # Если клонирование не удалось, скачиваем ZIP
          if [ ! -d "hikka" ]; then
            echo "📥 Downloading Hikka as ZIP..."
            curl -L https://github.com/hikariatama/hikka/archive/refs/heads/main.zip -o hikka.zip
            if [ -f "hikka.zip" ]; then
              unzip -q hikka.zip
              mv hikka-main hikka 2>/dev/null || mv hikka-* hikka 2>/dev/null || true
              rm hikka.zip
              echo "✅ Hikka downloaded from ZIP"
            fi
          else
            echo "✅ Hikka cloned successfully"
          fi
          
          # Проверяем наличие
          if [ -d "hikka" ]; then
            echo "✅ Hikka directory exists"
            ls -la hikka/
          else
            echo "❌ Hikka not found!"
            # Создаём заглушку
            mkdir -p hikka
            echo "# Hikka placeholder" > hikka/__init__.py
            echo "def main(): print('Hikka placeholder')" > hikka/__main__.py
          fi

      # 3. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Устанавливаем зависимости
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Создаём папку site-packages
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages
          
          # Устанавливаем зависимости для Hikka
          echo "📦 Installing dependencies..."
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages/
          
          # Если есть requirements.txt, устанавливаем оттуда
          if [ -f "HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt" ]; then
            echo "📦 Installing from requirements.txt..."
            pip install -r HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi
          
          echo "✅ Dependencies installed"
          ls -la HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages/

      # 5. Скачиваем Python.framework для iOS
      - name: Download Python framework
        run: |
          echo "📥 Downloading Python framework for iOS..."
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b4/Python-3.10-iOS-support.b4.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz
          
          # Создаём структуру папок
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload
          
          # Копируем Python.framework
          if [ -d "Python/Resources/Python.framework" ]; then
            cp -R Python/Resources/Python.framework/* HikkaWrapper/HikkaWrapper/Resources/Python.framework/
            echo "✅ Python.framework copied"
          fi
          
          # Копируем стандартную библиотеку
          if [ -d "Python/Resources/python-stdlib/lib/python3.10" ]; then
            cp -R Python/Resources/python-stdlib/lib/python3.10/* HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
            echo "✅ Python stdlib copied"
          fi
          
          # Копируем динамические библиотеки
          if [ -d "Python/Resources/lib" ]; then
            find Python/Resources/lib -name "*.dylib" -exec cp {} HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ \; 2>/dev/null || true
            echo "✅ Dynamic libraries copied"
          fi
          
          # Проверяем результат
          echo "📂 Python framework size:"
          du -sh HikkaWrapper/HikkaWrapper/Resources/Python.framework/ || echo "⚠️ Python.framework not found"
          echo "📂 Python lib size:"
          du -sh HikkaWrapper/HikkaWrapper/Resources/pythonlib/ || echo "⚠️ pythonlib not found"

      # 6. Создаём Xcode проект
      - name: Create Xcode project
        run: |
          # Создаём папки
          mkdir -p HikkaWrapper.xcodeproj
          mkdir -p Payload/HikkaWrapper.app/Frameworks
          mkdir -p Payload/HikkaWrapper.app/Resources
          
          # Копируем Swift файлы
          cp -r HikkaWrapper/* Payload/HikkaWrapper.app/ 2>/dev/null || true
          
          # Копируем Python.framework в .app
          cp -r HikkaWrapper/HikkaWrapper/Resources/Python.framework Payload/HikkaWrapper.app/Frameworks/ 2>/dev/null || true
          
          # Копируем pythonlib в .app
          cp -r HikkaWrapper/HikkaWrapper/Resources/pythonlib Payload/HikkaWrapper.app/ 2>/dev/null || true
          
          # Создаём Info.plist
          cat > Payload/HikkaWrapper.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIFileSharingEnabled</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Создаём исполняемый файл (заглушка)
          cat > Payload/HikkaWrapper.app/HikkaWrapper << 'EOF'
          #!/bin/bash
          echo "Hikka Wrapper for iOS"
          echo "Python userbot running..."
          EOF
          chmod +x Payload/HikkaWrapper.app/HikkaWrapper
          
          echo "✅ App structure created"
          ls -la Payload/HikkaWrapper.app/

      # 7. Создаём IPA
      - name: Create IPA
        run: |
          cd Payload
          zip -r ../HikkaWrapper.ipa .
          cd ..
          
          # Проверяем размер
          ls -lh HikkaWrapper.ipa
          file HikkaWrapper.ipa

      # 8. Загружаем артефакт
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7
