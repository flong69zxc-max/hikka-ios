name: Clean repository

on:
  workflow_dispatch:  # запуск вручную через вкладку Actions

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove everything except .github
        run: |
          # Удаляем все файлы и папки, кроме .github и .git
          find . -maxdepth 1 ! -name '.github' ! -name '.' ! -name '.git' -exec rm -rf {} +
          # Добавляем изменения в git
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean repository, keep only .github" || echo "No changes to commit"
          git push
