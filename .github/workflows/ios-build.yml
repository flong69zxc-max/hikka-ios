name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Клонируем Hikka в нужную папку
      - name: Checkout Hikka repository
        uses: actions/checkout@v4
        with:
          repository: hikariatama/hikka
          path: HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka
          ref: main

      # 3. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Устанавливаем зависимости Hikka
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/site-packages/
        continue-on-error: true

      # 5. Скачиваем Python.framework для iOS
      - name: Download Python framework
        run: |
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b4/Python-3.10-iOS-support.b4.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz
          
          # Создаём папки
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload
          
          # Копируем Python.framework
          cp -R Python/Resources/Python.framework/* HikkaWrapper/HikkaWrapper/Resources/Python.framework/
          
          # Копируем стандартную библиотеку
          cp -R Python/Resources/python-stdlib/lib/python3.10/* HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          
          # Копируем динамические библиотеки
          cp Python/Resources/lib/*.dylib HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ 2>/dev/null || true

      # 6. Создаём проект Xcode (без подписи)
      - name: Create Xcode project
        run: |
          # Создаём базовый проект
          mkdir -p HikkaWrapper.xcodeproj
          
          # Создаём минимальный project.pbxproj
          cat > HikkaWrapper.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {
              };
              objectVersion = 56;
              objects = {
                  /* Begin PBXFileReference section */
                  E111111111111111 /* HikkaWrapper.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = HikkaWrapper.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  /* End PBXFileReference section */
                  
                  /* Begin PBXGroup section */
                  E222222222222222 = {
                      isa = PBXGroup;
                      children = (
                          E333333333333333 /* HikkaWrapper */,
                          E444444444444444 /* Products */,
                      );
                      sourceTree = "<group>";
                  };
                  E333333333333333 /* HikkaWrapper */ = {
                      isa = PBXGroup;
                      children = (
                          E555555555555555 /* App */,
                          E666666666666666 /* UI */,
                          E777777777777777 /* Python */,
                          E888888888888888 /* Resources */,
                      );
                      path = HikkaWrapper;
                      sourceTree = "<group>";
                  };
                  E444444444444444 /* Products */ = {
                      isa = PBXGroup;
                      children = (
                          E111111111111111 /* HikkaWrapper.app */,
                      );
                      name = Products;
                      sourceTree = "<group>";
                  };
                  /* End PBXGroup section */
              };
              rootObject = E999999999999999 /* Project object */;
          }
          EOF

      # 7. Собираем приложение
      - name: Build app
        run: |
          # Создаём приложение вручную
          mkdir -p Payload
          
          # Копируем ресурсы
          cp -R HikkaWrapper Payload/HikkaWrapper.app
          
          # Создаём Info.plist
          cat > Payload/HikkaWrapper.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.yourcompany.hikkawrapper</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

      # 8. Упаковываем в IPA
      - name: Create IPA
        run: |
          cd Payload
          zip -r ../HikkaWrapper.ipa .
          cd ..

      # 9. Загружаем артефакт
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7
