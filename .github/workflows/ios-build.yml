name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 0. Полная очистка репозитория (кроме .git и .github) ----
      - name: Clean repository (keep .git and .github)
        run: |
          # Удаляем всё, кроме .git, .github и текущего workflow (чтобы не сломать выполнение)
          find . -maxdepth 1 -not -name '.git' -not -name '.github' -exec rm -rf {} + 2>/dev/null || true
          echo "🧹 Repository cleaned (except .git and .github)"

      # ---- 1. Получаем Hikka (с повторными попытками) ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          for i in {1..3}; do
            if git clone https://github.com/hikariatama/hikka.git; then
              break
            elif [ $i -eq 3 ]; then
              curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
              unzip -q hikka.zip
              mv hikka-main hikka
              rm hikka.zip
              break
            else
              sleep 2
            fi
          done

      # ---- 2. Установка Python и зависимостей ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install telethon yarl aiohttp cryptography pillow --no-cache-dir -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install --no-cache-dir -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем Python.framework (без конфликтов) ----
      - name: Download Python framework
        run: |
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b11/Python-3.10-iOS-support.b11.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz

          rm -rf HikkaWrapper/Resources/Python.framework
          rm -rf HikkaWrapper/Resources/pythonlib/python310/lib

          mkdir -p HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib

          XCFRAMEWORK_PATH=$(find . -type d -name "Python.xcframework" | head -1)
          if [ -n "$XCFRAMEWORK_PATH" ]; then
            if [ -d "$XCFRAMEWORK_PATH/ios-arm64/Python.framework" ]; then
              cp -R "$XCFRAMEWORK_PATH/ios-arm64/Python.framework"/* HikkaWrapper/Resources/Python.framework/
            else
              cp -R "$XCFRAMEWORK_PATH/ios-arm64"/* HikkaWrapper/Resources/Python.framework/
            fi
          else
            echo "⚠️ Python.xcframework not found, checking fallback..."
            FRAMEWORK_PATH=$(find . -name "Python.framework" -type d | head -1)
            if [ -n "$FRAMEWORK_PATH" ]; then
              cp -R "$FRAMEWORK_PATH"/* HikkaWrapper/Resources/Python.framework/
            fi
          fi

          STDLIB_SOURCE=$(find . -path "*/lib/python3.10" -type d | head -1)
          if [ -n "$STDLIB_SOURCE" ]; then
            cp -R "$STDLIB_SOURCE"/* HikkaWrapper/Resources/pythonlib/python310/lib/
          else
            STDLIB_SOURCE=$(find . -name "os.py" -exec dirname {} \; | head -1)
            if [ -n "$STDLIB_SOURCE" ]; then
              cp -R "$STDLIB_SOURCE"/* HikkaWrapper/Resources/pythonlib/python310/lib/
            fi
          fi

          find . -name "*.dylib" -exec cp -f {} HikkaWrapper/Resources/pythonlib/python310/lib/ \; 2>/dev/null || true

          echo "✅ Python resources prepared"

      # ---- 4. Создаём структуру проекта (как в mond, но без эксплойтов) ----
      - name: Create Swift sources
        run: |
          mkdir -p Sources/Views Sources/Helpers

          # ---------- bridging.h ----------
          cat > Sources/bridging.h <<'EOF'
          #ifndef bridging_h
          #define bridging_h

          #include <Python/Python.h>

          // Объявления C-функций Python для вызова из Swift
          extern void Py_Initialize(void);
          extern int Py_IsInitialized(void);
          extern const char* Py_GetVersion(void);
          extern int PyRun_SimpleString(const char*);

          #endif
          EOF

          # ---------- Helpers/AppState.swift ----------
          cat > Sources/Helpers/AppState.swift <<'EOF'
          import SwiftUI

          class AppState: ObservableObject {
              @Published var logs: [String] = []
              @Published var isPythonReady = false
              @Published var isHikkaRunning = false

              func addLog(_ msg: String) {
                  DispatchQueue.main.async {
                      self.logs.append("[\(Date().formatted())] \(msg)")
                      print(msg)
                  }
              }

              func clearLogs() {
                  DispatchQueue.main.async {
                      self.logs.removeAll()
                  }
              }
          }
          EOF

          # ---------- Helpers/PythonBridge.swift ----------
          cat > Sources/Helpers/PythonBridge.swift <<'EOF'
          import Foundation
          import SwiftUI

          // Функции из bridging.h
          @_silgen_name("Py_Initialize")
          func Py_Initialize()

          @_silgen_name("Py_IsInitialized")
          func Py_IsInitialized() -> Int32

          @_silgen_name("Py_GetVersion")
          func Py_GetVersion() -> UnsafePointer<CChar>

          @_silgen_name("PyRun_SimpleString")
          func PyRun_SimpleString(_: UnsafePointer<CChar>) -> Int32

          class PythonBridge {
              static let shared = PythonBridge()
              private init() {}

              func setup(appState: AppState) {
                  appState.addLog("🚀 Инициализация Python...")
                  let bundlePath = Bundle.main.bundlePath
                  let libPath = bundlePath + "/pythonlib/python310/lib"
                  let sitePath = bundlePath + "/pythonlib/python310/site-packages"
                  setenv("PYTHONHOME", libPath, 1)
                  setenv("PYTHONPATH", sitePath, 1)

                  Py_Initialize()
                  if Py_IsInitialized() != 0 {
                      let version = String(cString: Py_GetVersion())
                      appState.addLog("✅ Python \(version) инициализирован")
                      appState.isPythonReady = true
                      checkHikka(appState: appState)
                  } else {
                      appState.addLog("❌ Ошибка инициализации Python")
                  }
              }

              func checkHikka(appState: AppState) {
                  let code = """
                  import sys
                  try:
                      import hikka
                      print('✅ Hikka импортирован успешно')
                  except Exception as e:
                      print(f'❌ Ошибка импорта Hikka: {e}')
                  """
                  let result = PyRun_SimpleString(code)
                  if result == 0 {
                      appState.addLog("✅ Hikka успешно импортирован")
                      appState.isHikkaRunning = true
                  } else {
                      appState.addLog("❌ Ошибка импорта Hikka (код \(result))")
                  }
              }

              func runHikka(appState: AppState) {
                  guard appState.isHikkaRunning else {
                      appState.addLog("⚠️ Hikka не готов, сначала инициализируйте")
                      return
                  }
                  appState.addLog("▶️ Запуск Hikka...")
                  let code = """
                  try:
                      import hikka
                      # Здесь будет код запуска userbot
                      # hikka.run()
                      print('✅ Hikka выполнен успешно')
                  except Exception as e:
                      print(f'❌ Ошибка выполнения: {e}')
                  """
                  let result = PyRun_SimpleString(code)
                  if result == 0 {
                      appState.addLog("✅ Hikka выполнен успешно")
                  } else {
                      appState.addLog("❌ Ошибка выполнения (код \(result))")
                  }
              }
          }
          EOF

          # ---------- Views/ContentView.swift ----------
          cat > Sources/Views/ContentView.swift <<'EOF'
          import SwiftUI

          struct ContentView: View {
              @EnvironmentObject var appState: AppState

              var body: some View {
                  NavigationView {
                      VStack {
                          // Статус
                          HStack {
                              Circle()
                                  .fill(appState.isPythonReady ? Color.green : Color.red)
                                  .frame(width: 12, height: 12)
                              Text(appState.isPythonReady ? "Python готов" : "Python не инициализирован")
                                  .font(.caption)
                              Spacer()
                              if appState.isPythonReady {
                                  Button("Запустить Hikka") {
                                      PythonBridge.shared.runHikka(appState: appState)
                                  }
                                  .buttonStyle(.bordered)
                              }
                          }
                          .padding(.horizontal)

                          // Логи
                          ScrollView {
                              LazyVStack(alignment: .leading, spacing: 4) {
                                  ForEach(appState.logs.indices, id: \.self) { index in
                                      Text(appState.logs[index])
                                          .font(.system(.caption, design: .monospaced))
                                          .padding(.vertical, 1)
                                          .frame(maxWidth: .infinity, alignment: .leading)
                                  }
                              }
                              .padding()
                          }
                          .background(Color.gray.opacity(0.1))
                          .cornerRadius(8)
                          .padding(.horizontal)

                          HStack {
                              Button("Очистить логи") {
                                  appState.clearLogs()
                              }
                              .padding()

                              Spacer()
                          }

                          Spacer()
                      }
                      .navigationTitle("Hikka Wrapper")
                  }
                  .onAppear {
                      if !appState.isPythonReady {
                          PythonBridge.shared.setup(appState: appState)
                      }
                  }
              }
          }
          EOF

          # ---------- main.swift ----------
          cat > Sources/main.swift <<'EOF'
          import SwiftUI

          @main
          struct HikkaWrapperApp: App {
              @StateObject private var appState = AppState()

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(appState)
                  }
              }
          }
          EOF

          echo "✅ Swift sources created"

      # ---- 5. Компилируем все Swift-файлы в бинарник ----
      - name: Compile Swift
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -emit-executable \
            -o Sources/HikkaWrapper \
            Sources/main.swift \
            Sources/Helpers/*.swift \
            Sources/Views/*.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -parse-as-library \
            -import-objc-header Sources/bridging.h \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI

          if [ ! -f Sources/HikkaWrapper ]; then
            echo "❌ Бинарник не создан!"
            exit 1
          fi
          file Sources/HikkaWrapper | grep -q "Mach-O" || {
            echo "❌ Бинарник не является Mach-O!"
            exit 1
          }
          echo "✅ Бинарник успешно создан"

      # ---- 6. Создаём .app bundle ----
      - name: Create .app bundle
        run: |
          mkdir -p Payload/HikkaWrapper.app/Frameworks
          mkdir -p Payload/HikkaWrapper.app/pythonlib
          mkdir -p Payload/HikkaWrapper.app/Resources

          cp Sources/HikkaWrapper Payload/HikkaWrapper.app/

          if [ -d "HikkaWrapper/Resources/Python.framework" ]; then
            cp -R HikkaWrapper/Resources/Python.framework Payload/HikkaWrapper.app/Frameworks/
          fi
          if [ -d "HikkaWrapper/Resources/pythonlib" ]; then
            cp -R HikkaWrapper/Resources/pythonlib/* Payload/HikkaWrapper.app/pythonlib/
          fi

          cat > Payload/HikkaWrapper.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          echo "✅ .app bundle created"

      # ---- 7. Упаковываем в IPA ----
      - name: Package IPA
        run: |
          zip -r HikkaWrapper.ipa Payload
          ls -lh HikkaWrapper.ipa

      # ---- 8. Удаляем предыдущий релиз и тег ----
      - name: Delete previous release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Deleting existing release $TAG"
            gh release delete "$TAG" --yes
          fi
          if git rev-parse "$TAG" &>/dev/null; then
            echo "Deleting local tag $TAG"
            git tag -d "$TAG"
          fi
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Deleting remote tag $TAG"
            git push --delete origin "$TAG" || true
          fi

      # ---- 9. Создаём новый релиз ----
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          artifacts: "HikkaWrapper.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true

      # ---- 10. Артефакт ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7
