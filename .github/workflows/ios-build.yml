name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 1. Получаем Hikka ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          git clone https://github.com/hikariatama/hikka.git || true
          if [ ! -d hikka ]; then
            curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
            unzip -q hikka.zip
            mv hikka-main hikka
            rm hikka.zip
          fi

      # ---- 2. Установка Python и зависимостей ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем Python.framework для iOS ----
      - name: Download Python framework
        run: |
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b4/Python-3.10-iOS-support.b4.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz
          mkdir -p HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload
          cp -R Python/Resources/Python.framework/* HikkaWrapper/Resources/Python.framework/
          cp -R Python/Resources/python-stdlib/lib/python3.10/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          find Python/Resources/lib -name "*.dylib" -exec cp {} HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ \; 2>/dev/null || true

      # ---- 4. Создаём .app структуру ----
      - name: Create app bundle
        run: |
          APP_DIR=Payload/HikkaWrapper.app
          mkdir -p $APP_DIR/Frameworks $APP_DIR/pythonlib $APP_DIR/Resources
          cp -R HikkaWrapper/Resources/Python.framework $APP_DIR/Frameworks/
          cp -R HikkaWrapper/Resources/pythonlib/* $APP_DIR/pythonlib/

          # Info.plist
          cat > $APP_DIR/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          # Исполняемый файл-заглушка (можно заменить на реальный бинарник)
          cat > $APP_DIR/HikkaWrapper <<'EOF'
          #!/bin/bash
          echo "========================================="
          echo "  Hikka Wrapper for iOS"
          echo "  Python userbot ready"
          echo "========================================="
          # Здесь можно запустить Python с помощью PythonKit,
          # но для демонстрации оставляем заглушку
          EOF
          chmod +x $APP_DIR/HikkaWrapper

          # Проверка структуры
          echo "✅ App bundle created:"
          ls -la $APP_DIR

      # ---- 5. Упаковываем в IPA ----
      - name: Package IPA
        run: |
          cd Payload
          zip -r ../HikkaWrapper.ipa .
          cd ..
          ls -lh HikkaWrapper.ipa

      # ---- 6. Загружаем артефакт (для ручного скачивания) ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7

      # ---- 7. Создаём Release и прикрепляем IPA ----
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          files: HikkaWrapper.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
