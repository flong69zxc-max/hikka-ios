name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 1. Получаем Hikka ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          git clone https://github.com/hikariatama/hikka.git || true
          if [ ! -d hikka ]; then
            curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
            unzip -q hikka.zip
            mv hikka-main hikka
            rm hikka.zip
          fi

      # ---- 2. Установка Python и зависимостей ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем Python 3.10-b4 (с правильной структурой) ----
      - name: Download Python framework
        run: |
          # Используем версию 3.10-b4, где есть отдельные папки Python.framework и python-stdlib
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b4/Python-3.10-iOS-support.b4.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz

          # Проверяем структуру
          echo "=== Содержимое после распаковки ==="
          ls -la
          echo "=== Содержимое Python/Resources ==="
          ls -la Python/Resources/ || echo "Python/Resources не найдена"

          mkdir -p HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload

          # Копируем Python.framework
          if [ -d "Python/Resources/Python.framework" ]; then
            cp -R Python/Resources/Python.framework/* HikkaWrapper/Resources/Python.framework/
          else
            echo "❌ Python.framework не найден!"
            exit 1
          fi

          # Копируем python-stdlib
          if [ -d "Python/Resources/python-stdlib/lib" ]; then
            cp -R Python/Resources/python-stdlib/lib/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          elif [ -d "Python/Resources/python-stdlib" ]; then
            cp -R Python/Resources/python-stdlib/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          else
            echo "❌ python-stdlib не найден!"
            exit 1
          fi

          # Копируем .dylib
          find Python -name "*.dylib" -exec cp {} HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ \; 2>/dev/null || true

          # Проверка
          echo "=== Проверка Python.framework ==="
          ls -la HikkaWrapper/Resources/Python.framework/ | head -10
          echo "=== Проверка stdlib ==="
          ls -la HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/ | head -10

      # ---- 4. Создаём .app ----
      - name: Create .app bundle
        run: |
          mkdir -p Payload/HikkaWrapper.app/Frameworks
          mkdir -p Payload/HikkaWrapper.app/pythonlib
          mkdir -p Payload/HikkaWrapper.app/Resources

          cp -R HikkaWrapper/Resources/Python.framework Payload/HikkaWrapper.app/Frameworks/
          cp -R HikkaWrapper/Resources/pythonlib/* Payload/HikkaWrapper.app/pythonlib/

          cat > Payload/HikkaWrapper.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          cat > Payload/HikkaWrapper.app/HikkaWrapper <<'EOF'
          #!/bin/bash
          echo "========================================="
          echo "  Hikka Wrapper for iOS"
          echo "  Python userbot ready"
          echo "========================================="
          EOF
          chmod +x Payload/HikkaWrapper.app/HikkaWrapper

          echo "✅ .app bundle created at Payload/HikkaWrapper.app"

      # ---- 5. Упаковываем в IPA ----
      - name: Package IPA
        run: |
          zip -r HikkaWrapper.ipa Payload
          ls -lh HikkaWrapper.ipa
          echo "=== Проверяем структуру IPA ==="
          unzip -l HikkaWrapper.ipa | head -20

      # ---- 6. Артефакт ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7

      # ---- 7. Релиз ----
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          artifacts: "HikkaWrapper.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
