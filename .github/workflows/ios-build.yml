name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 1. Получаем Hikka (пока не используется, но оставим) ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          git clone https://github.com/hikariatama/hikka.git || true
          if [ ! -d hikka ]; then
            curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
            unzip -q hikka.zip
            mv hikka-main hikka
            rm hikka.zip
          fi

      # ---- 2. Установка Python (пока не используется, но оставим) ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем Python для iOS (опционально) ----
      - name: Download Python framework (optional)
        run: |
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b11/Python-3.10-iOS-support.b11.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz

          mkdir -p HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload

          XCFRAMEWORK_PATH=$(find . -type d -name "Python.xcframework" | head -1)
          if [ -n "$XCFRAMEWORK_PATH" ]; then
            if [ -d "$XCFRAMEWORK_PATH/ios-arm64/Python.framework" ]; then
              cp -R "$XCFRAMEWORK_PATH/ios-arm64/Python.framework"/* HikkaWrapper/Resources/Python.framework/
            else
              cp -R "$XCFRAMEWORK_PATH/ios-arm64"/* HikkaWrapper/Resources/Python.framework/
            fi
          fi

          STDLIB_SOURCE=$(find . -path "*/lib/python3.10" -type d | head -1)
          if [ -n "$STDLIB_SOURCE" ]; then
            cp -R "$STDLIB_SOURCE"/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          fi

          find . -name "*.dylib" -exec cp {} HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ \; 2>/dev/null || true
          echo "✅ Python resources prepared"

      # ---- 4. Создаём простое SwiftUI приложение (без внешних зависимостей) ----
      - name: Create Swift sources
        run: |
          mkdir -p Sources
          cat > Sources/HikkaWrapperApp.swift <<'EOF'
          import SwiftUI

          @main
          struct HikkaWrapperApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat > Sources/ContentView.swift <<'EOF'
          import SwiftUI

          struct ContentView: View {
              @State private var log = "Готов к работе!"
              @State private var counter = 0

              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "apple.terminal")
                          .font(.system(size: 60))
                          .foregroundColor(.blue)
                      Text("Hikka Wrapper")
                          .font(.largeTitle)
                          .fontWeight(.bold)
                      Text("iOS Python Userbot")
                          .font(.subheadline)
                          .foregroundColor(.gray)

                      Button(action: {
                          counter += 1
                          log = "Нажатий: \(counter)\nПоследнее действие: \(Date())"
                      }) {
                          Text("Нажми меня")
                              .padding()
                              .frame(maxWidth: .infinity)
                              .background(Color.blue)
                              .foregroundColor(.white)
                              .cornerRadius(12)
                      }
                      .padding(.horizontal)

                      ScrollView {
                          Text(log)
                              .font(.system(.body, design: .monospaced))
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .padding()
                      }
                      .background(Color.black.opacity(0.05))
                      .cornerRadius(8)
                      .frame(height: 150)
                      .padding(.horizontal)
                  }
                  .padding()
              }
          }
          EOF

      # ---- 5. Компилируем Swift в бинарник для iOS ----
      - name: Compile Swift
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -emit-executable \
            -o Sources/HikkaWrapper \
            Sources/HikkaWrapperApp.swift Sources/ContentView.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI
          file Sources/HikkaWrapper

      # ---- 6. Создаём .app ----
      - name: Create .app bundle
        run: |
          mkdir -p Payload/HikkaWrapper.app/Frameworks
          mkdir -p Payload/HikkaWrapper.app/pythonlib
          mkdir -p Payload/HikkaWrapper.app/Resources

          cp Sources/HikkaWrapper Payload/HikkaWrapper.app/

          # Копируем Python.framework и pythonlib (если есть)
          if [ -d "HikkaWrapper/Resources/Python.framework" ]; then
            cp -R HikkaWrapper/Resources/Python.framework Payload/HikkaWrapper.app/Frameworks/
          fi
          if [ -d "HikkaWrapper/Resources/pythonlib" ]; then
            cp -R HikkaWrapper/Resources/pythonlib/* Payload/HikkaWrapper.app/pythonlib/
          fi

          cat > Payload/HikkaWrapper.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          echo "✅ .app bundle created"

      # ---- 7. Упаковываем в IPA ----
      - name: Package IPA
        run: |
          zip -r HikkaWrapper.ipa Payload
          ls -lh HikkaWrapper.ipa
          unzip -l HikkaWrapper.ipa | head -20

      # ---- 8. Артефакт ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7

      # ---- 9. Релиз ----
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          artifacts: "HikkaWrapper.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
