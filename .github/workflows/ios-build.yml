name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Hikka repository
        uses: actions/checkout@v4
        with:
          repository: hikariatama/hikka
          path: HikkaWrapper/HikkaWrapper/Resources/pythonlib/site-packages/hikka
          ref: main  # или нужная ветка

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t HikkaWrapper/HikkaWrapper/Resources/pythonlib/site-packages/
        working-directory: HikkaWrapper/HikkaWrapper/Resources/pythonlib/site-packages/hikka

      - name: Prepare Python environment for iOS
        run: |
          # Копируем Python.framework из предварительно подготовленного архива
          # Или используем готовый бинарник от https://github.com/beeware/Python-Apple-support
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b4/Python-3.10-iOS-support.b4.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/Python.framework
          cp -R Python/Resources/Python.framework/* HikkaWrapper/HikkaWrapper/Resources/Python.framework/
          
          # Копируем stdlib из Python-Apple-support
          mkdir -p HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib
          cp -R Python/Resources/python-stdlib/lib/python3.10 HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/
          
          # Копируем динамические библиотеки
          cp Python/Resources/lib/*.dylib HikkaWrapper/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/

      - name: Build Xcode project (unsigned)
        run: |
          xcodebuild -project HikkaWrapper.xcodeproj \
            -scheme HikkaWrapper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            build

      - name: Export IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HikkaWrapper.app Payload/
          zip -r HikkaWrapper.ipa Payload

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7
