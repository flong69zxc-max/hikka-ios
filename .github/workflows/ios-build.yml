name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 1. Получаем Hikka ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          git clone https://github.com/hikariatama/hikka.git || true
          if [ ! -d hikka ]; then
            curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
            unzip -q hikka.zip
            mv hikka-main hikka
            rm hikka.zip
          fi

      # ---- 2. Установка Python и зависимостей ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем и распаковываем Python ----
      - name: Download and extract Python
        run: |
          # Скачиваем последнюю стабильную версию 3.10
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b11/Python-3.10-iOS-support.b11.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz

          # Создаём целевые папки
          mkdir -p HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload

          echo "=== Ищем Python.xcframework ==="
          # Ищем Python.xcframework (в новых версиях это xcframework, а не просто framework)
          XCFRAMEWORK_PATH=$(find . -type d -name "Python.xcframework" | head -1)
          if [ -n "$XCFRAMEWORK_PATH" ]; then
            echo "Найден Python.xcframework: $XCFRAMEWORK_PATH"
            # Копируем содержимое ios-arm64 слайса в Python.framework
            if [ -d "$XCFRAMEWORK_PATH/ios-arm64/Python.framework" ]; then
              cp -R "$XCFRAMEWORK_PATH/ios-arm64/Python.framework"/* HikkaWrapper/Resources/Python.framework/
            elif [ -d "$XCFRAMEWORK_PATH/ios-arm64" ]; then
              cp -R "$XCFRAMEWORK_PATH/ios-arm64"/* HikkaWrapper/Resources/Python.framework/
            else
              # Если структура другая, копируем всё
              cp -R "$XCFRAMEWORK_PATH"/* HikkaWrapper/Resources/Python.framework/
            fi
          else
            # Fallback: ищем Python.framework (для старых версий)
            FRAMEWORK_PATH=$(find . -type d -name "Python.framework" -not -path "*/HikkaWrapper/*" | head -1)
            if [ -n "$FRAMEWORK_PATH" ]; then
              echo "Найден Python.framework: $FRAMEWORK_PATH"
              cp -R "$FRAMEWORK_PATH"/* HikkaWrapper/Resources/Python.framework/
            else
              echo "❌ Python.framework не найден!"
              exit 1
            fi
          fi

          echo "=== Ищем python-stdlib ==="
          STDLIB_PATH=$(find . -type d -name "python-stdlib" -not -path "*/HikkaWrapper/*" | head -1)
          if [ -n "$STDLIB_PATH" ]; then
            echo "Найден python-stdlib: $STDLIB_PATH"
            if [ -d "$STDLIB_PATH/lib/python3.10" ]; then
              cp -R "$STDLIB_PATH/lib/python3.10"/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
            elif [ -d "$STDLIB_PATH/python3.10" ]; then
              cp -R "$STDLIB_PATH/python3.10"/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
            else
              cp -R "$STDLIB_PATH"/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
            fi
          else
            echo "❌ python-stdlib не найден!"
            exit 1
          fi

          # Копируем .dylib (если есть)
          find . -name "*.dylib" -not -path "*/Python.framework/*" -not -path "*/HikkaWrapper/*" -exec cp {} HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ \; 2>/dev/null || true

          echo "✅ Python успешно скопирован"
          echo "=== Проверка Python.framework ==="
          ls -la HikkaWrapper/Resources/Python.framework/ | head -10
          echo "=== Проверка stdlib ==="
          ls -la HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/ | head -10

      # ---- 4. Создаём .app ----
      - name: Create .app bundle
        run: |
          mkdir -p Payload/HikkaWrapper.app/Frameworks
          mkdir -p Payload/HikkaWrapper.app/pythonlib
          mkdir -p Payload/HikkaWrapper.app/Resources

          cp -R HikkaWrapper/Resources/Python.framework Payload/HikkaWrapper.app/Frameworks/
          cp -R HikkaWrapper/Resources/pythonlib/* Payload/HikkaWrapper.app/pythonlib/

          cat > Payload/HikkaWrapper.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          cat > Payload/HikkaWrapper.app/HikkaWrapper <<'EOF'
          #!/bin/bash
          echo "========================================="
          echo "  Hikka Wrapper for iOS"
          echo "  Python userbot ready"
          echo "========================================="
          EOF
          chmod +x Payload/HikkaWrapper.app/HikkaWrapper

          echo "✅ .app bundle created"

      # ---- 5. Упаковываем в IPA ----
      - name: Package IPA
        run: |
          zip -r HikkaWrapper.ipa Payload
          ls -lh HikkaWrapper.ipa
          echo "=== Структура IPA ==="
          unzip -l HikkaWrapper.ipa | head -20

      # ---- 6. Артефакт ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7

      # ---- 7. Релиз ----
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          artifacts: "HikkaWrapper.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
