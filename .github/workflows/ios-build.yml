name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 0. Очистка от предыдущих сборок ----
      - name: Clean previous build artifacts
        run: |
          rm -rf HikkaWrapper Payload Sources python_ios.tar.gz *.ipa
          echo "🧹 Cleaned old files"

      # ---- 1. Получаем Hikka (с повторными попытками) ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          # Пытаемся клонировать, если не выйдет – скачиваем архив
          for i in {1..3}; do
            if git clone https://github.com/hikariatama/hikka.git; then
              break
            elif [ $i -eq 3 ]; then
              curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
              unzip -q hikka.zip
              mv hikka-main hikka
              rm hikka.zip
              break
            else
              sleep 2
            fi
          done

      # ---- 2. Установка Python и зависимостей ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install telethon yarl aiohttp cryptography pillow --no-cache-dir -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install --no-cache-dir -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем Python.framework (без конфликтов копирования) ----
      - name: Download Python framework
        run: |
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b11/Python-3.10-iOS-support.b11.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz

          # Полная очистка старых ресурсов
          rm -rf HikkaWrapper/Resources/Python.framework
          rm -rf HikkaWrapper/Resources/pythonlib/python310/lib

          mkdir -p HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib

          # Копируем Python.framework
          XCFRAMEWORK_PATH=$(find . -type d -name "Python.xcframework" | head -1)
          if [ -n "$XCFRAMEWORK_PATH" ]; then
            if [ -d "$XCFRAMEWORK_PATH/ios-arm64/Python.framework" ]; then
              cp -R "$XCFRAMEWORK_PATH/ios-arm64/Python.framework"/* HikkaWrapper/Resources/Python.framework/
            else
              cp -R "$XCFRAMEWORK_PATH/ios-arm64"/* HikkaWrapper/Resources/Python.framework/
            fi
          else
            echo "⚠️ Python.xcframework not found, checking fallback..."
            # fallback: ищем любую папку с Python.framework
            FRAMEWORK_PATH=$(find . -name "Python.framework" -type d | head -1)
            if [ -n "$FRAMEWORK_PATH" ]; then
              cp -R "$FRAMEWORK_PATH"/* HikkaWrapper/Resources/Python.framework/
            fi
          fi

          # Копируем стандартную библиотеку (ищем наиболее полную)
          STDLIB_SOURCE=$(find . -path "*/lib/python3.10" -type d | head -1)
          if [ -n "$STDLIB_SOURCE" ]; then
            cp -R "$STDLIB_SOURCE"/* HikkaWrapper/Resources/pythonlib/python310/lib/
          else
            # альтернативный поиск
            STDLIB_SOURCE=$(find . -name "os.py" -exec dirname {} \; | head -1)
            if [ -n "$STDLIB_SOURCE" ]; then
              cp -R "$STDLIB_SOURCE"/* HikkaWrapper/Resources/pythonlib/python310/lib/
            fi
          fi

          # Копируем все .dylib прямо в lib (без lib-dynload, чтобы избежать конфликтов)
          find . -name "*.dylib" -exec cp -f {} HikkaWrapper/Resources/pythonlib/python310/lib/ \; 2>/dev/null || true

          echo "✅ Python resources prepared"

      # ---- 4. Создаём SwiftUI приложение ----
      - name: Create Swift sources
        run: |
          mkdir -p Sources
          cat > Sources/main.swift <<'EOF'
          import SwiftUI

          @main
          struct AppMain: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct ContentView: View {
              @State private var counter = 0
              @State private var log = "Нажми кнопку"

              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "apple.terminal")
                          .font(.system(size: 60))
                          .foregroundColor(.blue)
                      Text("Hikka Wrapper")
                          .font(.largeTitle)
                          .fontWeight(.bold)
                      Text("iOS Userbot")
                          .font(.subheadline)
                          .foregroundColor(.gray)

                      Button(action: {
                          counter += 1
                          log = "Нажатий: \(counter)\nПоследнее: \(Date())"
                      }) {
                          Text("Нажми меня")
                              .padding()
                              .frame(maxWidth: .infinity)
                              .background(Color.blue)
                              .foregroundColor(.white)
                              .cornerRadius(12)
                      }
                      .padding(.horizontal)

                      ScrollView {
                          Text(log)
                              .font(.system(.body, design: .monospaced))
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .padding()
                      }
                      .background(Color.black.opacity(0.05))
                      .cornerRadius(8)
                      .frame(height: 150)
                      .padding(.horizontal)
                  }
                  .padding()
              }
          }
          EOF

      # ---- 5. Компилируем в бинарник для iOS (с ключами для библиотек) ----
      - name: Compile Swift
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -emit-executable \
            -o Sources/HikkaWrapper \
            Sources/main.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -parse-as-library \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI

          if [ ! -f Sources/HikkaWrapper ]; then
            echo "❌ Бинарник не создан!"
            exit 1
          fi
          file Sources/HikkaWrapper | grep -q "Mach-O" || {
            echo "❌ Бинарник не является Mach-O!"
            exit 1
          }
          echo "✅ Бинарник успешно создан"

      # ---- 6. Создаём .app ----
      - name: Create .app bundle
        run: |
          mkdir -p Payload/HikkaWrapper.app/Frameworks
          mkdir -p Payload/HikkaWrapper.app/pythonlib
          mkdir -p Payload/HikkaWrapper.app/Resources

          cp Sources/HikkaWrapper Payload/HikkaWrapper.app/

          if [ -d "HikkaWrapper/Resources/Python.framework" ]; then
            cp -R HikkaWrapper/Resources/Python.framework Payload/HikkaWrapper.app/Frameworks/
          fi
          if [ -d "HikkaWrapper/Resources/pythonlib" ]; then
            cp -R HikkaWrapper/Resources/pythonlib/* Payload/HikkaWrapper.app/pythonlib/
          fi

          cat > Payload/HikkaWrapper.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          echo "✅ .app bundle created"

      # ---- 7. Упаковываем в IPA ----
      - name: Package IPA
        run: |
          zip -r HikkaWrapper.ipa Payload
          ls -lh HikkaWrapper.ipa

      # ---- 8. Удаляем предыдущий релиз и тег (с гарантией) ----
      - name: Delete previous release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          # Проверяем наличие релиза и удаляем
          if gh release view "$TAG" &>/dev/null; then
            echo "Deleting existing release $TAG"
            gh release delete "$TAG" --yes
          fi
          # Проверяем наличие тега локально и на удалённом
          if git rev-parse "$TAG" &>/dev/null; then
            echo "Deleting local tag $TAG"
            git tag -d "$TAG"
          fi
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Deleting remote tag $TAG"
            git push --delete origin "$TAG" || true
          fi

      # ---- 9. Создаём новый релиз ----
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          artifacts: "HikkaWrapper.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true

      # ---- 10. Артефакт (опционально) ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7
