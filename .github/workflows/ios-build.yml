name: Build Unsigned IPA for LiveContainer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # 1. Сборка архива без проверки подписей
      - name: Build Xcode Archive
        run: |
          xcodebuild -project "ИМЯ_ПРОЕКТА.xcodeproj" \
                     -scheme "ИМЯ_СХЕМЫ" \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     archive

      # 2. Экспорт архива в .ipa формат
      - name: Export Unsigned IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      # 3. Загрузка готового .ipa в артефакты GitHub
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikka-unsigned-ipa
          path: ${{ runner.temp }}/build/*.ipa
