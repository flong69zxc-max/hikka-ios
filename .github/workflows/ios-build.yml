name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 1. Получаем Hikka ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          git clone https://github.com/hikariatama/hikka.git || true
          if [ ! -d hikka ]; then
            curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
            unzip -q hikka.zip
            mv hikka-main hikka
            rm hikka.zip
          fi

      # ---- 2. Установка Python и зависимостей ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем и распаковываем Python для iOS ----
      - name: Download Python framework
        run: |
          # Скачиваем архив
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b4/Python-3.10-iOS-support.b4.tar.gz -o python_ios.tar.gz
          tar -xzf python_ios.tar.gz

          # Выводим структуру для отладки
          echo "=== Contents of extracted archive ==="
          ls -la
          echo "=== Searching for Python.xcframework ==="
          find . -name "*.xcframework" -type d
          echo "=== Searching for python-stdlib ==="
          find . -name "python-stdlib" -type d

          # Создаём папки
          mkdir -p HikkaWrapper/Resources/Python.framework
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload

          # Копируем Python.xcframework в Python.framework
          if [ -d "Python.xcframework" ]; then
            echo "📦 Found Python.xcframework, copying to Python.framework..."
            # Копируем содержимое ios-arm64 папки в Python.framework
            if [ -d "Python.xcframework/ios-arm64" ]; then
              cp -R Python.xcframework/ios-arm64/* HikkaWrapper/Resources/Python.framework/
              # Переименовываем Python.swiftmodule в Python (если нужно)
              if [ -f "HikkaWrapper/Resources/Python.framework/Python" ]; then
                echo "✅ Python binary found"
              else
                # Ищем бинарник
                BINARY=$(find Python.xcframework -name "Python" -type f | head -1)
                if [ -n "$BINARY" ]; then
                  cp "$BINARY" HikkaWrapper/Resources/Python.framework/
                fi
              fi
            else
              # Копируем всё содержимое xcframework
              cp -R Python.xcframework/* HikkaWrapper/Resources/Python.framework/
            fi
            echo "✅ Python.xcframework copied"
          else
            echo "❌ Python.xcframework not found!"
            exit 1
          fi

          # Копируем стандартную библиотеку
          if [ -d "python-stdlib/lib/python3.10" ]; then
            cp -R python-stdlib/lib/python3.10/* HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
            echo "✅ python-stdlib copied"
          else
            echo "❌ python-stdlib not found!"
            exit 1
          fi

          # Копируем динамические библиотеки (если есть)
          find . -name "*.dylib" -exec cp {} HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ \; 2>/dev/null || true
          echo "✅ Dynamic libraries copied"

          # Проверяем структуру
          echo "=== Python.framework contents ==="
          ls -la HikkaWrapper/Resources/Python.framework/
          echo "=== pythonlib contents ==="
          ls -la HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/ | head -20

      # ---- 4. Создаём .app структуру ----
      - name: Create app bundle
        run: |
          APP_DIR=Payload/HikkaWrapper.app
          mkdir -p "$APP_DIR/Frameworks" "$APP_DIR/pythonlib" "$APP_DIR/Resources"
          cp -R HikkaWrapper/Resources/Python.framework "$APP_DIR/Frameworks/"
          cp -R HikkaWrapper/Resources/pythonlib/* "$APP_DIR/pythonlib/"

          # Info.plist
          cat > "$APP_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          # Исполняемый файл
          cat > "$APP_DIR/HikkaWrapper" <<'EOF'
          #!/bin/bash
          echo "========================================="
          echo "  Hikka Wrapper for iOS"
          echo "  Python userbot ready"
          echo "========================================="
          EOF
          chmod +x "$APP_DIR/HikkaWrapper"

          echo "✅ App bundle created"
          ls -la "$APP_DIR"

      # ---- 5. Упаковываем в IPA ----
      - name: Package IPA
        run: |
          cd Payload
          zip -r ../HikkaWrapper.ipa .
          cd ..
          ls -lh HikkaWrapper.ipa

      # ---- 6. Загружаем артефакт ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7

      # ---- 7. Создаём Release ----
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          files: HikkaWrapper.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
