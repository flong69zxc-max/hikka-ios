name: Build iOS IPA and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write          # даём права на создание релизов

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 1. Получаем Hikka ----
      - name: Clone Hikka
        run: |
          mkdir -p HikkaWrapper/Resources/pythonlib/python310/site-packages
          cd HikkaWrapper/Resources/pythonlib/python310/site-packages
          git clone https://github.com/hikariatama/hikka.git || true
          if [ ! -d hikka ]; then
            curl -L https://github.com/hikariatama/hikka/archive/main.zip -o hikka.zip
            unzip -q hikka.zip
            mv hikka-main hikka
            rm hikka.zip
          fi

      # ---- 2. Установка Python и зависимостей ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install telethon yarl aiohttp cryptography pillow -t HikkaWrapper/Resources/pythonlib/python310/site-packages/
          if [ -f HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt ]; then
            pip install -r HikkaWrapper/Resources/pythonlib/python310/site-packages/hikka/requirements.txt -t HikkaWrapper/Resources/pythonlib/python310/site-packages/ || true
          fi

      # ---- 3. Скачиваем Python для iOS ----
      - name: Download Python framework
        run: |
          curl -L https://github.com/beeware/Python-Apple-support/releases/download/3.10-b4/Python-3.10-iOS-support.b4.tar.gz -o python_ios.tar.gz
          mkdir -p python_ios_extracted
          tar -xzf python_ios.tar.gz -C python_ios_extracted
          EXTRACT_DIR=$(find python_ios_extracted -maxdepth 1 -type d -name "Python-*" | head -1)
          if [ -z "$EXTRACT_DIR" ]; then
            echo "❌ Could not find extracted directory"
            exit 1
          fi
          echo "Extracted directory: $EXTRACT_DIR"
          cd "$EXTRACT_DIR"

          # Создаём необходимые директории в workspace
          mkdir -p $GITHUB_WORKSPACE/HikkaWrapper/Resources
          mkdir -p $GITHUB_WORKSPACE/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10
          mkdir -p $GITHUB_WORKSPACE/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload

          # Копируем Python.framework
          if [ -d "Python.xcframework/ios-arm64/Python.framework" ]; then
            cp -R Python.xcframework/ios-arm64/Python.framework $GITHUB_WORKSPACE/HikkaWrapper/Resources/
          else
            mkdir -p $GITHUB_WORKSPACE/HikkaWrapper/Resources/Python.framework
            cp -R Python.xcframework/ios-arm64/* $GITHUB_WORKSPACE/HikkaWrapper/Resources/Python.framework/
          fi

          # Копируем стандартную библиотеку
          if [ -d "python-stdlib/lib" ]; then
            cp -R python-stdlib/lib/* $GITHUB_WORKSPACE/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          elif [ -d "python-stdlib/python3.10" ]; then
            cp -R python-stdlib/python3.10/* $GITHUB_WORKSPACE/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          elif [ -d "python-stdlib" ]; then
            cp -R python-stdlib/* $GITHUB_WORKSPACE/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/
          else
            echo "❌ python-stdlib not found!"
            exit 1
          fi

          # Копируем динамические библиотеки (исключая фреймворк)
          find . -name "*.dylib" -not -path "*/Python.framework/*" -exec cp {} $GITHUB_WORKSPACE/HikkaWrapper/Resources/pythonlib/python310/lib/python3.10/lib-dynload/ \; 2>/dev/null || true

      # ---- 4. Создаём .app с правильной структурой для IPA ----
      - name: Create .app bundle
        run: |
          # Создаём папку .app
          mkdir -p Payload/HikkaWrapper.app/Frameworks
          mkdir -p Payload/HikkaWrapper.app/pythonlib
          mkdir -p Payload/HikkaWrapper.app/Resources

          # Копируем ресурсы
          cp -R HikkaWrapper/Resources/Python.framework Payload/HikkaWrapper.app/Frameworks/
          cp -R HikkaWrapper/Resources/pythonlib/* Payload/HikkaWrapper.app/pythonlib/

          # Info.plist
          cat > Payload/HikkaWrapper.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HikkaWrapper</string>
              <key>CFBundleIdentifier</key>
              <string>com.hikka.wrapper</string>
              <key>CFBundleName</key>
              <string>HikkaWrapper</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          # Исполняемый файл (заглушка)
          cat > Payload/HikkaWrapper.app/HikkaWrapper <<'EOF'
          #!/bin/bash
          echo "========================================="
          echo "  Hikka Wrapper for iOS"
          echo "  Python userbot ready"
          echo "========================================="
          EOF
          chmod +x Payload/HikkaWrapper.app/HikkaWrapper

          echo "✅ .app bundle created at Payload/HikkaWrapper.app"
          ls -la Payload/

      # ---- 5. Упаковываем в ПРАВИЛЬНЫЙ .ipa ----
      - name: Package IPA
        run: |
          # Создаём IPA с папкой Payload в корне
          zip -r HikkaWrapper.ipa Payload
          ls -lh HikkaWrapper.ipa
          echo "=== Проверяем структуру IPA ==="
          unzip -l HikkaWrapper.ipa | head -20

      # ---- 6. Загружаем артефакт ----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikkaWrapper-unsigned
          path: HikkaWrapper.ipa
          retention-days: 7

      # ---- 7. Создаём Release ----
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          artifacts: "HikkaWrapper.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
